<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="icon" type="image/png" href="/favicon.png?v=2" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2" />
    <link rel="shortcut icon" href="/favicon.ico?v=2" />
    <script>
      (function () {
        var allowed = ["/favicon.svg?v=2", "/favicon.png?v=2", "/favicon.ico?v=2"];
        function useBlankFavicon() {
          document.querySelectorAll('link[rel*="icon"], link[rel="shortcut icon"]').forEach(function (node) {
            var href = node.getAttribute("href") || "";
            if (allowed.indexOf(href) === -1) {
              node.parentNode && node.parentNode.removeChild(node);
            }
          });
          if (!document.querySelector('link[rel="icon"]')) {
            var link = document.createElement("link");
            link.rel = "icon";
            link.type = "image/svg+xml";
            link.href = "/favicon.svg?v=2";
            document.head.appendChild(link);
          }
        }
        useBlankFavicon();
        document.addEventListener("DOMContentLoaded", useBlankFavicon);
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2F3465" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

  </body>
</html>
