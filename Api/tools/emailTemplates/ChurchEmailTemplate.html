<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="x-apple-disable-message-reformatting">
  <title></title>

  <style>
    html,
    body {
      margin: 0 auto !important;
      padding: 0 !important;
      height: 100% !important;
      width: 100% !important;
      background: #f1f1f1;
    }

    * {
      -ms-text-size-adjust: 100%;
      -webkit-text-size-adjust: 100%;
    }

    div[style*="margin: 16px 0"] {
      margin: 0 !important;
    }

    table,
    td {
      mso-table-lspace: 0pt !important;
      mso-table-rspace: 0pt !important;
    }

    table {
      border-spacing: 0 !important;
      border-collapse: collapse !important;
      table-layout: fixed !important;
      margin: 0 auto !important;
    }

    img {
      -ms-interpolation-mode: bicubic;
    }

    a {
      text-decoration: none;
    }

    .btn-primary {
      border-radius: 10px;
      background: #2f3465;
      color: #ffffff !important;
      padding: 12px 18px;
      display: inline-block;
      font-weight: 700;
      font-family: Arial, Helvetica, sans-serif;
      box-shadow: 0 10px 20px rgba(17, 24, 39, 0.22);
    }

    .bg_white {
      background: #ffffff;
    }

    .heading-section h2 {
      color: #111827;
      font-size: 24px;
      margin-top: 0;
      line-height: 1.2;
      font-weight: 800;
      font-family: Arial, Helvetica, sans-serif;
    }

    .logo h1 {
      margin: 0;
    }

    .logo h1 a {
      color: #111827;
      font-size: 20px;
      font-weight: 800;
      font-family: Arial, Helvetica, sans-serif;
      letter-spacing: -0.2px;
    }
  </style>
</head>

<body width="100%" style="margin: 0; padding: 0 !important; mso-line-height-rule: exactly; background-color: #f1f1f1;">
  <center style="width: 100%; background-color: #f1f1f1;">
    <div style="display: none; font-size: 1px;max-height: 0px; max-width: 0px; opacity: 0; overflow: hidden; mso-hide: all; font-family: sans-serif;">
      &zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;
    </div>
    <div style="max-width: 600px; margin: 0 auto;" class="email-container">
      <!-- BEGIN BODY -->
      <table align="center" role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="margin: auto;">
        <tr>
          <td valign="top" class="bg_white" style="padding: 18px 22px 0 22px;">
            <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%">
              <tr>
                <td class="logo" style="text-align: center;">
                  <h1 style="margin: 0;">{appLink}</h1>
                </td>
              </tr>
            </table>
          </td>
        </tr><!-- end tr -->
        <tr>
          <td valign="middle" class="hero bg_white" style="padding: 18px 0 22px 0;">
            <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%">
              <tr>
                <td>
                  <div class="text" style="padding: 0 22px; text-align: center;">
                    {contents}
                  </div>
                </td>
              </tr>
            </table>
          </td>
        </tr><!-- end tr -->
        <!-- 1 Column Text + Button : END -->
      </table>

      <!-- Footer -->
      <table align="center" role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="margin: auto;">
        <tr>
          <td valign="middle" style="background: #0b1220;">
            <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
              <tr>
                <td style="padding: 18px 22px; text-align: left;">
                  <div style="font-family: Arial, Helvetica, sans-serif;">
                    <div style="font-weight: 800; font-size: 14px; color: #ffffff; margin: 0 0 8px 0;">Contact Support</div>
                    <div style="font-size: 13px; line-height: 20px; color: rgba(255,255,255,0.82);">
                      <div style="margin: 0 0 4px 0;">
                        <a href="mailto:support@goodnewsworld.org" style="color: #D6B25E; text-decoration: none;">support@goodnewsworld.org</a>
                      </div>
                      <div style="margin: 0 0 4px 0;">
                        <a href="tel:+263773814658" style="color: #D6B25E; text-decoration: none;">+263 773 814 658</a>
                      </div>
                      <div style="margin: 0;">
                        <a href="https://support.goodnewsworld.org" style="color: #D6B25E; text-decoration: none;">support.goodnewsworld.org</a>
                      </div>
                    </div>
                  </div>
                </td>
              </tr>
            </table>
          </td>
        </tr>
      </table>

    </div>
  </center>
</body>

</html>
